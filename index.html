<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Broken Furniture Are You?</title>
<style>
:root{--bg:#dcebe3;--ink:#2b2a33;--rust:#b5502d;--bandage:#f1c7b3;--note:#f6e27a;--card:#fbf8f1;--shadow:#2b2a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2b27;--ink:#f3eee4;--card:#2e3a35;--shadow:#0c1210;--bandage:#7a4a3a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--bandage);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--note);bottom:-60px;right:-60px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#9fd0bf;top:40%;left:60%;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.25)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 60px;text-align:center}
h1{font-size:clamp(34px,8vw,64px);line-height:1;margin:10px 0 6px;font-weight:800;letter-spacing:-1.5px}
h1 span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-4deg)}}
.note{font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Marker Felt",cursive;font-size:24px;display:inline-block;background:var(--note);color:#2b2a33;padding:4px 14px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--shadow);margin:8px 0 18px}
.row{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;min-height:120px;margin:18px 0}
.sp{display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));flex:none;transform-origin:bottom center}
.row .sp{animation:bounce 1.6s ease-in-out infinite;cursor:pointer}
.row .sp:hover{animation:spin .8s ease}
@keyframes bounce{0%,100%{transform:scale(1,1)}20%{transform:scale(1.08,.9)}45%{transform:translateY(-18px) scale(.95,1.08)}70%{transform:scale(1.05,.94)}}
@keyframes spin{to{transform:rotate(360deg) scale(1.2)}}
button{font:800 20px "Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;color:#2b2a33;background:var(--bandage);border:3px solid var(--shadow);border-radius:14px;padding:12px 26px;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
button:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--shadow)}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}
button:focus-visible{outline:4px solid var(--rust);outline-offset:3px}
.cta{animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.07)}}
.card{background:var(--card);border:3px solid var(--shadow);border-radius:20px;box-shadow:8px 8px 0 var(--shadow);padding:22px 18px;position:relative}
.card::before{content:"";position:absolute;top:-14px;right:24px;width:64px;height:24px;background:var(--bandage);opacity:.95;transform:rotate(8deg);border:2px solid var(--shadow)}
.prog{height:16px;border:3px solid var(--shadow);border-radius:10px;background:var(--card);margin:0 0 18px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--rust) 0 10px,#d9774f 10px 20px);transition:width .5s;animation:slide 1s linear infinite;background-size:28px 28px}
@keyframes slide{to{background-position:28px 0}}
.q{font-size:clamp(22px,5vw,30px);margin:8px 0 18px;line-height:1.15;font-weight:800}
.qwho{display:flex;justify-content:center;height:90px;margin-bottom:4px}
.opt{display:block;width:100%;margin:10px 0;text-align:left;font-size:18px;font-weight:500;padding:13px 16px;background:var(--card);color:var(--ink)}
.opt:hover{background:var(--note);color:#2b2a33}
.in{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}.out{animation:away .3s ease-in both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
@keyframes away{to{transform:translateX(-120%) rotate(-12deg);opacity:0}}
.tag{display:inline-block;background:var(--rust);color:#fff;padding:3px 12px;border-radius:99px;font-size:15px;margin:3px;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(3deg) scale(1.05)}}
.big{display:flex;justify-content:center;margin:6px 0 0;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
h2{font-size:clamp(30px,7vw,46px);margin:6px 0;line-height:1;font-weight:800}
.motto{font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Marker Felt",cursive;font-size:26px;color:var(--rust)}
p{font-size:17px;line-height:1.5;margin:10px 0}
.bars{text-align:left;margin:16px 0}.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.bar b{width:112px;flex:none;font-weight:500}.bar span{flex:1;height:14px;border:2px solid var(--shadow);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rust);width:0;transition:width 1.2s cubic-bezier(.2,1.4,.4,1)}
.conf{position:fixed;top:-30px;z-index:5;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hide{display:none}
.fine{font-size:13px;opacity:.7;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sp{position:relative}
.react{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin-top:18px;text-align:left}
.bubble{position:relative;flex:1 1 210px;background:var(--note);color:#2b2a33;border:3px solid var(--shadow);border-radius:16px;padding:10px 14px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Marker Felt",cursive;font-size:25px;line-height:1.1;box-shadow:3px 3px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;width:15px;height:15px;background:var(--note);border-left:3px solid var(--shadow);border-bottom:3px solid var(--shadow);transform:rotate(45deg)}
.bubble small{display:block;font:500 13px "Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;margin-top:6px;opacity:.75}
.nx{position:relative;overflow:hidden;flex:0 0 100%;font-size:16px;padding:8px 20px}
.nx i{position:absolute;inset:0 auto 0 0;width:0;background:var(--note);transition:width 3.6s linear}
.nx span{position:relative}
.opt:disabled{cursor:default;transform:none}
#lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:6;font-size:15px;padding:6px 14px;border-radius:99px;box-shadow:3px 3px 0 var(--shadow);animation:none}
main{padding-top:56px}
html[dir=rtl] body,html[dir=rtl] button,html[dir=rtl] .note,html[dir=rtl] .motto,html[dir=rtl] .bubble{font-family:Tahoma,"Segoe UI","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif}
html[dir=rtl] h1{letter-spacing:0;line-height:1.35}
html[dir=rtl] .note{font-size:19px;font-weight:700}html[dir=rtl] .motto{font-size:21px;line-height:1.6;font-weight:700}
html[dir=rtl] .bubble{font-size:18px;line-height:1.7;font-weight:700}html[dir=rtl] .bubble small{font-size:15px}
html[dir=rtl] p{line-height:1.9}html[dir=rtl] .q{line-height:1.5}
html[dir=rtl] .react,html[dir=rtl] .opt,html[dir=rtl] .bars{text-align:right}
html[dir=rtl] .nx i{inset:0 0 0 auto}
html[dir=rtl] .tag{line-height:1.5}
html[dir=rtl] .bubble::before{left:auto;right:-10px;border-left:0;border-right:3px solid var(--shadow);transform:rotate(-45deg)}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<button id="lang" type="button" aria-label="Language">فارسی</button>
<main>
<section id="intro">
<h1 id="title"></h1>
<div class="note" id="note"></div>
<div class="row" id="row"></div>
<p id="introp"></p>
<button class="cta" id="start"></button>
<p class="fine" id="fine">For fun only. Not a diagnosis, not philosophy homework, and not responsible for any furniture feelings.</p>
</section>
<section id="quiz" class="hide">
<div class="prog"><i id="bar"></i></div>
<div class="card" id="qcard"><div class="qwho" id="qwho"></div><div class="q" id="qtext"></div><div id="opts"></div><div id="react"></div></div>
<p class="fine" id="qn"></p>
</section>
<section id="res" class="hide"><div class="card" id="rcard"></div></section>
</main>

{n:"The Patchwork Box",c:["Impostor syndrome","Chronic self-patching"],p:"Existentialism",m:"“I'm held together by tape and vibes.”",d:"You are made of something designed to be temporary, and part of you knows it. You stand on your folded cardboard feet with bandages in every corner, quietly convinced you're a stand-in for a sturdier piece of furniture that hasn't arrived yet. Compliments slide off you like rain off wax paper, because somewhere inside you suspect a mix-up at the warehouse.<br><br>Yet you keep showing up. You fit into any room, hold whatever is handed to you, and reshape yourself to suit the occasion. Nobody sees how much effort the folding takes. You love fast and hard because you assume it won't last, and your tape marks tell the story of every time you were stretched and managed to hold anyway."},
{n:"The Torn Red Chair",c:["High-functioning burnout","Dramatic resilience"],p:"Absurdism (Camus)",m:"“The seat is ripped. The smile is not.”",d:"You are loud in color and tired in structure. Your red coat is bright enough to spot from across the room, but your backrest is ripped open and the stuffing of your days has long since flattened. Everyone treats you as the sturdy seat for their problems, and you have never once sent a bill. You smile, because the face on your backrest is built that way, and because a frown would crack the vinyl further.<br><br>Inside, there is a running joke between you and the universe: you were told life is a sit-down affair, yet it has mostly been standing around. You tell your story with perfect comic timing. Every tear in your upholstery is a punchline, and you somehow stay upright through all of them."},
{n:"The Wobbly Stool",c:["Anxious attachment","Overthinking in 4 legs"],p:"Ubuntu: “I am because we are”",m:"“I can stand. With a little crutch. And that's fine.”",d:"You wobble, and you stopped apologizing for it long ago. One of your legs was replaced by a crutch, and instead of hiding it you carry it like a signature. Your mind sits taller than your legs: you perch high, see everything, and worry about all of it, from the unfinished sentence at lunch to the eventual death of the sun.<br><br>You are an overthinker with excellent posture. Anxiety reaches you as a gentle sway, a three-legged rhythm everyone around you recognizes. People are drawn to you because you never pretend to be freestanding. Your whole story is a quiet proof that holding up the weight of a day can be a shared job, and that a stool on borrowed support is still a stool with a very large heart."},
{n:"The Filing Cabinet",c:["Perfectionism","Emotional alphabetization"],p:"Kantian duty",m:"“A place for everything. Especially my feelings.”",d:"You are order in a rusting jacket. Two drawers, two handles, two little label plates waiting for the right words, and everything inside you is sorted by a system no one else has ever been allowed to read. You file feelings by date and urgency, keep a folder for worries not yet due, and a cross-reference for the ones that will hurt later. Chaos is tolerated only when it is dated, signed and put away.<br><br>Under the neat surface, rust is spreading in small orange islands that you describe as decorative. You believe a perfectly maintained life would simply run smoothly, and every torn scrap of tape on your face is a note in the margin of that belief. You are the person who remembers the date of the thing, the form number of the thing, and the exact tone of the thing someone said three years ago."},
{n:"The Holey Table",c:["Existential emptiness","Holding it together anyway"],p:"Nihilism with a lunch-break",m:"“There's a hole in me and I still carry everyone's snacks.”",d:"There is a hole in the middle of you, black and ragged and impressively large, and everyone has politely agreed not to mention it. Meanwhile you carry on: you hold the cups, the meetings and the arguments about nothing. A stacked ottoman sits tucked beneath you, a soft companion you shelter without having been asked.<br><br>You have a relaxed relationship with emptiness. Where other people see a void, you see storage space that isn't in use yet. You've wondered more than once whether anything matters, and your answer is a calm shrug that somehow keeps supporting the world on four metal legs. One leg is bandaged, one is rust-orange, and the whole structure is held together by the mildly absurd idea that standing is enough."},
{n:"The Secretive Dresser",c:["Emotional suppression","Drawer-based avoidance"],p:"Jung's Shadow",m:"“Don't open the bottom drawer.”",d:"You look friendly from the front: four drawers, rainbow knobs, a neat little face. It is the bottom drawer that gives you away, hanging slightly open with the dark showing, like a sentence left unfinished. Inside you are layers, folded and stacked by season, with the heaviest feelings buried under the lightest sweaters.<br><br>You are a keeper of things unsaid. Each drawer holds a different version of you, and only the top one is dressed for company. The colored knobs make you seem cheerful, and for the most part you are. But some things in you haven't been opened in years, and you know exactly where they are, down to the smell of the wood. You have mastered the art of looking like a simple piece of furniture while being an entire archive."},
{n:"The Comfy Armchair",c:["Comfort addiction","Professional procrastination"],p:"Epicureanism",m:"“Pleasure is a philosophy. Stay.”",d:"You are warmth with a few holes. Your leather is cracked, your cushion has a dent shaped like everyone who ever needed to collapse, and a stitched patch on your shoulder makes you look like you've survived a small war and come out fluffier. You believe pleasure is a legitimate philosophy and that the good life is mostly a well-supported spine and a lap blanket.<br><br>People visit you to forget their day, and rooms seem to slow down around you. Time passes differently near your cushions, in long syrupy afternoons. Part of you wonders whether being a place to rest is a calling or a hiding spot, and the answer you've settled on is that it is both. You hold a lot of conversation in your seams, and none of it is ever repeated."},
{n:"The Weary Bed",c:["Insomnia","Reality avoidance"],p:"Plato's Cave (dream edition)",m:"“Reality is overrated. Mattress springs are not.”",d:"You are a rusty frame with wavy springs that curve like a tired smile. A pale face plate sits on your headboard, calm and slightly unfocused, as if it has been awake for several nights in a row. One of your legs wears a wrap of tape and a small hinge, a repair you stopped noticing long ago.<br><br>Everyone arrives at you in their weakest hour: feverish, heartbroken, or simply done. You have witnessed a thousand dreams and you know the exact weight of someone who has given up on the day. Your view of reality is that it's overrated and mostly arrives at 7 a.m. The world outside is loud, and you are a creaking, patient place where the lights go off and everything is allowed to stop for a while."},
{n:"The Loyal Wooden Chair",c:["People-pleasing","Caretaker fatigue"],p:"Ethics of care",m:"“Sit down. I'll hold everything together.”",d:"You are plain, upright, and wearing more tape than a parcel. Strips cross your seat, wrap your backrest and hold your legs together, and still you are the chair everyone drags over when someone needs to sit down and talk. Your face plate is small and a little crooked, like it was added later by someone who loved you.<br><br>You are the one who gives. You give your seat, your time, your good side and your last bit of patience, then patch yourself up and give again. You have an almost unnoticeable habit of leaning toward whoever is sitting on you. Your care is practical and steady and never makes a speech. The scratched varnish and white paint flakes are the record of every person who was held up by you without noticing."},
{n:"The Flickering Lamp",c:["Hypervigilance","Light-giver burnout"],p:"The Enlightenment, running low on bulbs",m:"“I lit up the room. Now the room should buy me a bulb.”",d:"You are tall, thin and slightly crooked, with a lampshade that has seen better decades. A bandage sits above one eye like a medal, and the little pull cord swings with every draft. Your light is warm and a bit unreliable, and you've always taken it as your job to keep the room visible, whether anyone asked or not.<br><br>You notice everything: the exits, the mood, the person whose smile stopped a moment too early. That sharpness never fully switches off, even at night, and it can make quiet rooms feel like they're keeping watch. You carry the idea that your purpose is illumination, and you've become very good at glowing through a crack in your base. You light up for everyone else and rarely check whether your own bulb has been replaced."},
{n:"The Shy Nightstand",c:["Social anxiety","Secret-keeping"],p:"Quiet Epicureanism",m:"“Small, tidy, and best at 11 p.m.”",d:"You are small, compact and very good with secrets. Your top drawers hold the notes, the phone charger, the tissue nobody mentions, and your face sits there, mild and wide-eyed, listening. You are used to people at their most vulnerable: 11 p.m., 3 a.m., the moment between sleep and the first thought.<br><br>Crowds drain you fast, and one good friend recharges you completely. You aren't shy so much as concentrated: all your warmth is packed into a small frame, and you only unpack it for people who have earned a seat beside the bed. The peeling paint and tape across your front are the marks of a piece that has been handled gently and often, leaned on in the dark for years."},{n:"The Overpacked Backpack",c:["Emotional baggage","Chronic over-preparedness"],p:"Stoicism",m:"“I packed a bandage for you. And one for me. And three spares.”",d:"You carry everyone's things. Snacks, tissues, spare keys, a first-aid kit, secrets, and a mysterious sticky item from 2019 that you're not ready to examine. Your buckle is polished brass and your pockets are stitched like someone who plans ahead, with colorful buttons and a few bandage crosses for the things that might go wrong.<br><br>You are always prepared for the adventure and never quite sure you've arrived. You hold on to tickets, letters and memories with a fondness that could fill a shed. You have a talent for being exactly what a moment needs, a bandage, a snack, a coat, but putting your own things down is not something you've practiced. The straps have faded where other people's burdens rested, and the whole bag has the soft, lived-in look of a very long road."}];

["Ship of Theseus: every part of you gets replaced by duct tape. Are you still you?",[["Yes. Scars are my personality.",[1,11,8]],["No. I'm someone new every Tuesday.",[9,0,5]],["Define “you”.",[4,3,2]],["Who cares, as long as I'm comfy.",[6,7,10]]]],
["How do you store your emotions?",[["Neat labeled folders, alphabetized",[3,9,11]],["Shoved in the bottom drawer, locked",[5,10,4]],["Spilled on whoever sits next to me",[8,2,1]],["Nap it off",[7,6,0]]]],
["A friend invites you to a party.",[["Yes! (regret it at 9 p.m.)",[1,8,9]],["40 minutes, seat near the exit",[10,2,3]],["I'll attend in spirit. And under a blanket.",[7,6,5]],["Only if I can hold the entire event together",[11,0,4]]]],

["What is your purpose in life?",[["To be useful, even cracked",[11,1,3]],["To light the way for others",[8,9,10]],["To exist. Purpose is a bonus.",[7,6,0]],["To hold things until someone notices me",[2,4,5]]]],
["How do you treat your flaws?",[["Patch it, tape it, smile",[1,0,8]],["Hide them behind a nice lampshade",[5,10,9]],["Flaws are holes that let the light in",[4,11,2]],["It's not damage, it's vintage",[6,7,3]]]],

["You look in the mirror. You see…",[["A masterpiece with minor structural issues",[0,1,6]],["A haunted bookshelf",[5,4,3]],["Someone who needs eight more hours",[7,10,11]],["Someone helpful. Maybe too helpful.",[8,2,9]]]],
["A free Sunday afternoon. You…",[["Clean, then clean the cleaning tools",[3,9,1]],["Lie horizontally as an art form",[6,7,0]],["Visit everyone, bring soup",[11,8,2]],["Stare at a wall until enlightened",[5,10,4]]]],
["Someone says “we need to talk.” Your heart…",[["Is already apologizing",[8,2,0]],["Prepares a slideshow of defenses",[1,9,3]],["Pretends to be asleep",[7,6,10]],["Calmly notes that all things end",[4,11,5]]]],
["Free will or fate?",[["Fate. Also, snacks.",[6,7,10]],["Free will, with a lot of paperwork",[11,9,3]],["Neither. I just wobble.",[2,1,0]],["Whatever it is, it's holding my weight",[4,5,8]]]],
["Silence feels like…",[["A safe, closed drawer",[11,5,10]],["Loud. Very, very loud.",[9,1,2]],["An invitation to nap",[7,6,8]],["A table with nothing on it",[4,0,3]]]],
["Pick a superpower.",[["Never needing to sleep",[9,3,1]],["Sleeping anywhere, instantly",[7,6,11]],["Invisible at parties",[10,5,0]],["Fix anyone with a hug",[2,8,4]]]],
["Your relationship with time?",[["Always late, always apologizing",[2,8,0]],["Early. By exactly 14 minutes.",[3,9,1]],["Time is a flat circle, like my cushion",[11,4,6]],["Only exists after 10 p.m.",[10,5,7]]]],
["A crack appears in your wall. You…",[["Name it and give it a hat",[1,0,6]],["Call a professional immediately",[9,3,11]],["Hang a painting over it",[5,10,4]],["Cry in a friend's arms",[7,2,8]]]],
["Sartre says “hell is other people.” You say…",[["Hell is a group chat",[10,5,7]],["Hell is when they leave",[8,2,9]],["Hell is a missing label",[3,4,11]],["Hell is Monday",[0,1,6]]]],
["Someone praises you. You…",[["Look for the trap",[5,3,1]],["Melt into a puddle",[0,10,7]],["Hug them (too long)",[2,8,6]],["Light up. Literally.",[9,11,4]]]],

["Pick a sound.",[["A drawer clicking shut",[5,3,11]],["The creak of a favorite chair",[6,8,2]],["A lamp humming at midnight",[1,9,10]],["Rain on a distant roof",[0,4,7]]]],

["Panic hits. Your first move?",[["Tidy something",[5,3,6]],["Turn off all the lights",[9,10,7]],["Call someone",[11,8,2]],["Freeze until it passes",[0,1,4]]]],

["You have a visible bandage. You…",[["Cherish it as decor",[0,1,6]],["Replace it with a neat one",[3,9,11]],["Hope nobody notices",[7,10,5]],["Wear it proudly, tell the story",[2,8,4]]]],
["Your friends describe you as…",[["The reliable one",[3,4,8]],["The sleepy one",[11,6,7]],["The quiet one",[10,5,2]],["The intense one",[9,1,0]]]],
["Plato says a perfect form of everything exists. You…",[["Am a rough draft of the Perfect Chair",[8,2,1]],["Wish to meet the Perfect Bed",[7,6,11]],["Say: no forms, only vibes",[4,0,9]],["Am the form of a dutiful cabinet",[10,5,3]]]],
["Your biggest fear?",[["Being forgotten in a storage room",[2,10,5]],["Being replaced by a newer model",[1,6,3]],["Burning out in public",[9,0,8]],["Becoming nothing",[4,11,7]]]],
["Last one: are you enough, holes and all?",[["Yes. The holes are structural.",[4,9,1]],["Getting there. Slowly. With tape.",[8,2,0]],["Ask me after a nap.",[10,7,6]],["Only if my drawers stay closed.",[11,5,3]]]]];
const CM=[["Held together by tape and hope. That’s actually kind of sad.", "Temporary, but trying. Respect.", "A cardboard box with feelings. We’ve all been there.", "Bold of you to show your soft cardboard side."], ["Tired but fabulous. Honestly iconic, and a little sad.", "Dramatic. The torn seat approves.", "Smiling through the rips? Relatable.", "Burnout, but make it red."], ["Leaning on a crutch and admitting it. That’s actually brave.", "Wobble noted. Support recommended.", "Aww. Stool hugs for you.", "That one made my legs shake."], ["Alphabetized feelings. Oof. That’s actually sad.", "Drawer closed. Filed under: unresolved.", "Perfection is exhausting, you know.", "Neat on the outside, rust on the inside."], ["There’s a hole in that answer. And it’s honest.", "Holding everything up, feeling nothing. Classic table.", "That was either deep or very empty. Both?", "Void acknowledged. It’s cozy in here, actually."], ["The bottom drawer is open. I saw that.", "Suppressing it politely. Very dresser of you.", "That’s what drawers are for. Don’t open them.", "Colorful knobs, hidden sadness. Impressive range."], ["Comfy and quietly sad. A classic armchair move.", "Rest is not laziness. It’s armchair philosophy.", "You deserve a very long sit.", "That answer had cushioning. Nice."], ["Tired. Very tired. That’s actually sad.", "Sleep is a valid answer. Always.", "Your springs are showing. It’s okay.", "Dreams are cheaper than reality."], ["Giving everything to everyone. That’s actually sad.", "You can sit down too, you know.", "Taped together and still helping. Heroic.", "Please let someone hold you for once."], ["Lighting up the room while running on empty. Oof.", "Bright, but the bulb is flickering. Rest soon.", "Hypervigilant glow detected.", "Even the sun takes nights off."], ["Small, quiet, and secretly holding everything. Aww.", "Social battery: 4%. We see you.", "That was a whisper-answer. I heard it.", "A glass of water, a book, and secrets. Very you."], ["So much baggage! You can put some down, you know.", "Prepared for everything except rest.", "That answer has the whole sandwich collection in it.", "Packed a bandage for everyone. And for you?"]],MS={"4": "5 down. Your furniture is warming up.", "9": "10 answered. The rust is starting to show.", "14": "Halfway. The ottoman is concerned.", "19": "20 answered. Your tape is peeling. Don’t worry.", "24": "Five more. The lamp is nervous.", "29": "That’s all of them. Go meet your furniture."};
const RF=[{"n": "جعبه‌ی وصله‌دار", "c": ["سندرم ایمپاستر", "وصله‌کاریِ مزمنِ خود"], "p": "اگزیستانسیالیسم", "m": "«با چسب و حال‌وهوا سرِ پا مانده‌ام.»", "d": "تو از چیزی ساخته شده‌ای که قرار بود موقتی باشد، و بخشی از وجودت این را می‌داند. روی پاهای تاخورده‌ی مقوایی‌ات ایستاده‌ای، در هر گوشه‌ات یک زخم‌بند چسبیده، و آرام‌آرام باور داری جانشینِ یک مبلِ محکم‌تری هستی که هنوز نرسیده. تعریف‌ها مثل باران از روی کاغذ مومی از رویت سر می‌خورند، چون یک گوشه‌ی ذهنت مطمئن است توی انبار اشتباهی رخ داده.<br><br>اما تو باز هم می‌آیی. در هر اتاقی جا می‌شوی، هرچه به دستت بدهند نگه می‌داری و خودت را با موقعیت جور می‌کنی. هیچ‌کس نمی‌بیند این تاکردن‌ها چقدر زحمت دارد. تند و عمیق دوست می‌داری چون فکر می‌کنی ماندنی نیست، و جای چسب‌هایت قصه‌ی همه‌ی باری است که کشیده شدی و باز هم دوام آوردی."}, {"n": "صندلیِ قرمزِ پاره", "c": ["فرسودگیِ شیک", "تاب‌آوریِ نمایشی"], "p": "پوچ‌گرایی (کامو)", "m": "«نشیمن پاره شده. لبخند نه.»", "d": "رنگت بلند است و ساختارت خسته. کتِ قرمزت از آن‌سوی اتاق هم دیده می‌شود، اما پشتی‌ات پاره شده و پرِ روزهایت مدت‌هاست خوابیده. همه تو را صندلی محکمِ دردهایشان می‌دانند و تو هیچ‌وقت صورت‌حساب نداده‌ای. لبخند می‌زنی، چون صورتِ روی پشتی‌ات همین‌طور ساخته شده و چون اخم، چرمِ بیچاره را بیشتر می‌ترکاند.<br><br>درونت یک شوخیِ همیشگی میان تو و جهان جریان دارد: به تو گفته‌اند زندگی کارِ نشستن است، ولی بیشترش ایستادن بوده. قصه‌ات را با زمان‌بندیِ کمدین‌ها تعریف می‌کنی. هر پارگیِ رویه‌ات یک پانچ‌لاین است و تو به‌طرز عجیبی تا آخرِ همه‌شان سرپا می‌مانی."}, {"n": "چهارپایه‌ی لق", "c": ["اضطرابِ وابستگی", "زیادفکری روی پاهای لق"], "p": "اوبونتو: «ما هستیم، پس من هستم»", "m": "«می‌توانم بایستم. با یک عصا. و اشکالی ندارد.»", "d": "تو لق می‌زنی و خیلی وقت است که دیگر عذرخواهی نمی‌کنی. یکی از پاهایت را یک عصا عوض کرده و تو به‌جای قایم‌کردنش مثل امضا با خودت می‌بریش. ذهنت از پاهایت بلندتر است: بالا می‌نشینی، همه‌چیز را می‌بینی و به همه‌چیز فکر می‌کنی، از جمله‌ی نیمه‌تمامِ سرِ ناهار تا مرگ خورشید.<br><br>تو زیادفکرِ خوش‌قامتی هستی. اضطراب برایت مثل یک تاب‌خوردنِ ملایم می‌آید، ریتمِ سه‌پایه‌ای که همه‌ی اطرافیانت می‌شناسندش. مردم به تو کشیده می‌شوند چون هیچ‌وقت وانمود نمی‌کنی روی پای خودت ایستاده‌ای. تمام داستانت اثباتی آرام است بر اینکه تحمل وزن یک روز می‌تواند کارِ دسته‌جمعی باشد، و چهارپایه‌ای که به تکیه‌گاهِ قرضی ایستاده، هنوز دلِ خیلی بزرگی دارد."}, {"n": "کابینت بایگانی", "c": ["کمال‌گرایی", "الفبایی‌کردنِ احساسات"], "p": "وظیفه‌گراییِ کانتی", "m": "«برای همه‌چیز جایی هست. مخصوصاً برای احساساتم.»", "d": "تو نظم هستی در کتی زنگ‌زده. دو کشو، دو دستگیره، دو تابلوی برچسب که منتظر کلمه‌ی درست‌اند، و هرچه درونت است با سیستمی طبقه‌بندی شده که هیچ‌کس اجازه‌ی خواندنش را نداشته. احساسات را بر اساس تاریخ و فوریت بایگانی می‌کنی، برای نگرانی‌های هنوزسررسیدنشده پوشه داری و برای آن‌هایی که بعداً درد می‌کنند ارجاع متقابل. بی‌نظمی فقط وقتی تحمل می‌شود که تاریخ و امضا داشته باشد و سرجایش گذاشته شده باشد.<br><br>زیر این ظاهرِ مرتب، زنگ دارد در جزیره‌های نارنجیِ کوچک پخش می‌شود که تو اسمش را «تزئین» گذاشته‌ای. باور داری زندگیِ کاملاً نگهداری‌شده خودبه‌خود روان پیش می‌رود، و هر تکه چسبِ پاره روی صورتت یادداشتی است در حاشیه‌ی همین باور. تو همان کسی هستی که تاریخِ آن اتفاق، شماره‌ی فرمِ آن اتفاق و دقیقاً لحنِ حرفی را یادش هست که سه سال پیش یکی زده."}, {"n": "میزِ سوراخ", "c": ["پوچیِ وجودی", "نگه‌داشتنِ همه‌چیز با این حال"], "p": "نیهیلیسم، با یک وقتِ ناهار", "m": "«یک سوراخ توی من هست و باز هم تنقلاتِ همه را نگه می‌دارم.»", "d": "وسطِ تو یک سوراخ هست، سیاه و دندانه‌دار و به‌طرز چشمگیری بزرگ، و همه مؤدبانه توافق کرده‌اند حرفش را نزنند. در همین حال تو ادامه می‌دهی: فنجان‌ها، جلسه‌ها و بحث‌های درباره‌ی هیچ را نگه می‌داری. یک پوفِ دوطبقه هم زیرِ تو پناه گرفته، همدمِ نرمی که بی‌آنکه کسی بخواهد زیر سایه‌ات نگهش می‌داری.<br><br>رابطه‌ات با پوچی آرام است. جایی که دیگران خلأ می‌بینند، تو فضای انباری می‌بینی که هنوز استفاده نشده. بارها از خودت پرسیده‌ای آیا چیزی اهمیت دارد، و جوابت یک بالا انداختنِ شانه‌ی آرام است که با این حال دنیا را روی چهار پای فلزی نگه می‌دارد. یک پایه زخم‌بند دارد، یکی نارنجیِ زنگ‌زده، و کل ساختار به این ایده‌ی کمی پوچ سرِ هم مانده که ایستادن کافی است."}, function sp(i,z){const w=document.createElement("div");w.className="sp";const e=document.createElement("img");e.src=IMGS[i];e.alt=(L=="fa"?RF:R)[i].n;e.draggable=false;e.style.cssText="display:block;width:100%;height:100%";if(AR[i]>=1){w.style.width=z+"px";w.style.height=z/AR[i]+"px"}else{w.style.height=z+"px";w.style.width=z*AR[i]+"px"}w.append(e);return w}
R.forEach((r,i)=>{const e=sp(i,Math.min(86,(innerWidth-40)/4.6));e.style.animationDelay=(i*.15)+"s";e.title=R[i].n;$("row").append(e)});
const fd=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const U={en:{title:"Which Furniture Are You?",note:"a very serious clinical-ish quiz",intro:"Thirty questions about 3 a.m. thoughts, duct tape, and the meaning of legs.<br>Twelve battered, bandaged characters. One of them is you.",start:"Check me in",fine:"For fun only. Not a diagnosis, not philosophy homework, and not responsible for any furniture feelings.",qn:(a,b)=>`Question ${a} of ${b}`,next:"Next",see:"See my furniture",you:"You are…",fam:"Your furniture family",again:"Take it again"},
fa:{title:"تو کدام اثاثیه‌ای؟",note:"یک آزمون خیلی جدی و تقریباً بالینی",intro:"سی سؤال درباره‌ی فکرهای ساعت ۳ نصفه‌شب، چسب برق و معنای پا داشتن.<br>دوازده شخصیتِ کهنه و زخم‌بندی‌شده. یکی‌شان تویی.",start:"پذیرشم کن",fine:"فقط برای سرگرمی. نه تشخیص پزشکی است، نه تکلیف فلسفه، و هیچ مسئولیتی در قبال احساساتِ اثاثیه ندارد.",qn:(a,b)=>`سؤال ${fd(a)} از ${fd(b)}`,next:"بعدی",see:"اثاثیه‌ام را ببین",you:"تو این هستی…",fam:"خانواده‌ی اثاثیه‌ی تو",again:"دوباره امتحان کن"}};
const T=k=>U[L][k],rr=i=>L=="fa"?RF[i]:R[i];
function applyUI(){const fa=L=="fa";document.documentElement.lang=L;document.documentElement.dir=fa?"rtl":"ltr";document.title=T("title");
$("title").replaceChildren();T("title").split(" ").forEach((w,i)=>{const s=document.createElement("span");s.textContent=w+" ";s.style.animationDelay=i*.2+"s";$("title").append(s)});
$("note").textContent=T("note");$("introp").innerHTML=T("intro");$("start").textContent=T("start");$("fine").textContent=T("fine");$("lang").textContent=fa?"English":"فارسی";
[...$("row").children].forEach((e,i)=>e.title=rr(i).n)}
$("lang").onclick=()=>{L=L=="en"?"fa":"en";applyUI();
if(!$("quiz").classList.contains("hide")){clearTimeout(tm);if(picked)undo.forEach(([id,p])=>sc[id]-=p);ask()}
else if(!$("res").classList.contains("hide"))renderRes(false)};
applyUI();
let q=0,sc;
$("start").onclick=()=>{sc=Array(12).fill(0);q=0;show("quiz");ask()};
function show(id){["intro","quiz","res"].forEach(s=>$(s).classList.toggle("hide",s!==id));scrollTo(0,0)}
function ask(){picked=0;$("react").replaceChildren();const[t0,o]=Q[q],t=L=="fa"?QF[q][0]:t0;$("bar").style.width=(q/Q.length*100)+"%";$("qn").textContent=T("qn")(q+1,Q.length);
$("qwho").replaceChildren(sp((q*5+2)%12,78));$("qwho").firstChild.style.animation="bounce 1.4s infinite";
$("qtext").textContent=t;$("opts").replaceChildren();
o.forEach(([txt,ids],k)=>{const b=document.createElement("button");b.className="opt";b.textContent=L=="fa"?QF[q][1][k]:txt;b.onclick=()=>pick(ids,b);$("opts").append(b)});
$("qcard").className="card in"}
function pick(ids,b){if(picked)return;picked=1;ids=ids.slice();const lead=ids[0];undo=ids.map((id,k)=>[id,k?1:2]);undo.forEach(([id,p])=>sc[id]+=p);
document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;o.style.opacity=o===b?1:.4});b.style.background="var(--note)";b.style.color="#2b2a33";
const pl=(L=="fa"?CMF:CM)[lead],line=pl[Math.floor(Math.random()*pl.length)],ms=(L=="fa"?MSF:MS)[q],r=$("react");
r.className="react in";r.replaceChildren(sp(lead,70));
r.insertAdjacentHTML("beforeend",`<div class="bubble">${line}${ms?`<small>${ms}</small>`:""}</div>`);
const nx=document.createElement("button");nx.className="nx";nx.innerHTML="<i></i><span>"+(q<Q.length-1?T("next"):T("see"))+"</span>";r.append(nx);
const go=()=>{clearTimeout(tm);$("qcard").className="card out";setTimeout(()=>{if(++q<Q.length)ask();else done()},300)};
nx.onclick=go;tm=setTimeout(go,3800);requestAnimationFrame(()=>requestAnimationFrame(()=>{nx.firstChild.style.transitionDuration="3.8s";nx.firstChild.style.width="100%"}))}
function done(){const tb=sc.map(()=>Math.random());last=sc.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]||tb[b[1]]-tb[a[1]]);renderRes(true)}
function renderRes(conf){const rk=last,w=rk[0][1],r=rr(w),max=rk[0][0]||1;
show("res");const card=$("rcard");card.className="card in";card.replaceChildren();
const big=document.createElement("div");big.className="big";big.append(sp(w,250));
card.innerHTML=`<div class="note">${T("you")}</div>`;card.append(big);
card.insertAdjacentHTML("beforeend",`<h2>${r.n}</h2><div>${r.c.map(c=>`<span class="tag">${c}</span>`).join("")}<span class="tag" style="background:#3f7f6b">${r.p}</span></div><div class="motto">${r.m}</div><p>${r.d}</p><div class="bars"><b>${T("fam")}</b>${rk.slice(0,4).map(([v,i])=>`<div class="bar"><b>${rr(i).n.replace("The ","")}</b><span><i data-w="${Math.round(v/max*100)}"></i></span></div>`).join("")}</div><button id="again">${T("again")}</button>`);
setTimeout(()=>card.querySelectorAll("i").forEach(e=>e.style.width=e.dataset.w+"%"),100);
$("again").onclick=()=>{clearTimeout(tm);show("intro")};
const em=["🩹","🪑","✨","🛋️","🔧","💡","🩹"];
for(let i=0;conf&&i<40;i++){const c=document.createElement("div");c.className="conf";c.textContent=em[i%em.length];c.style.left=Math.random()*100+"vw";c.style.animationDuration=2+Math.random()*3+"s";c.style.animationDelay=Math.random()*1.5+"s";document.body.append(c);setTimeout(()=>c.remove(),7000)}}
</script></body></html>
